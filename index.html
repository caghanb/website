<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Op. Dr. Çağhan Benli</title>
<meta name="description" content="Op. Dr. Çağhan Benli, Plastik, Rekonstrüktif ve Estetik Cerrahi Uzmanı. Çanakkale Mehmet Akif Ersoy Devlet Hastanesi. Rekonstrüktif mikrocerrahi, estetik cerrahi, baş-boyun ve yüz cerrahisi.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://drcaghan.com/">
<meta property="og:title" content="Op. Dr. Çağhan Benli">
<meta property="og:description" content="Plastik, Rekonstrüktif ve Estetik Cerrahi Uzmanı · Çanakkale">
<meta property="og:image" content="https://drcaghan.com/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f2f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1622" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: airy clinical canvas, navy type, one teal accent.
     The single signature motif is a stitched vessel line (end-to-end anastomosis) under the hero. */
  --bg:#f2f7f9;
  --surface:#ffffff;
  --ink:#0f2740;
  --muted:#55697b;
  --line:#d5e1e8;
  --panel:#0e2b4a;
  --on-panel:#e9f3f6;
  --on-panel-muted:#a9c2d1;
  --accent:#087a76;
  --accent-bright:#19b3ab;
  --accent-soft:#dcf1ef;
  --gold:#b68235;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --radius:20px;      /* cards, frames, panels */
  --radius-sm:12px;   /* rows inside a card */
  --m-in:150ms; --m-out:120ms; --m-press:90ms;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-enter:cubic-bezier(.22,1,.36,1);
  --wrap:1120px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1622; --surface:#111f2e; --ink:#e3ecf2; --muted:#9ab0c0; --line:#23384c;
    --panel:#12304f; --on-panel:#e9f3f6; --on-panel-muted:#a9c2d1;
    --accent:#4fd0c6; --accent-bright:#4fd0c6; --accent-soft:#11353a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1622; --surface:#111f2e; --ink:#e3ecf2; --muted:#9ab0c0; --line:#23384c;
  --panel:#12304f; --on-panel:#e9f3f6; --on-panel-muted:#a9c2d1;
  --accent:#4fd0c6; --accent-bright:#4fd0c6; --accent-soft:#11353a;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:var(--accent);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:-0.015em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

/* Logo (traced from the supplied artwork; text layers follow the theme) */
.lg-gold{fill:var(--gold);stroke:var(--gold);stroke-linejoin:round}
.lg-ink{fill:var(--ink)}
.lg-grey{fill:var(--muted)}
.lg-line{fill:var(--line)}
.logo{display:block;stroke-width:0;overflow:visible}

/* Header */
.site-head{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;gap:20px;min-height:68px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand-mark{height:44px;width:auto;stroke-width:12}
.brand-text{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand-text b{font-family:var(--font-display);font-weight:600;font-size:1.25rem;letter-spacing:-0.02em}
.brand-text span{font-size:.8rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
.nav{display:flex;gap:4px 26px;flex-wrap:wrap}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem;transition:color var(--m-out) var(--ease)}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform var(--m-out) var(--ease)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::after{height:2px;background:var(--accent);transform:scaleX(1)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 .8rem var(--font-body);min-height:36px;min-width:44px;padding:5px 11px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* Generic blocks */
main{display:block;min-height:60vh}
.page{padding:56px 0 80px;display:flex;flex-direction:column;gap:64px}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.page-head{display:flex;flex-direction:column;gap:14px;max-width:760px}
.page-head h1{font-size:clamp(2.1rem,4.6vw,3.2rem);font-weight:600}
.lead{font-size:1.15rem;color:var(--muted);max-width:62ch}
.sec{display:flex;flex-direction:column;gap:24px;scroll-margin-top:96px}
.sec > h2{font-size:1.6rem;font-weight:600}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sec-row h2{font-size:1.6rem;font-weight:600}
.more{font-weight:600;text-decoration:none}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font:600 .98rem var(--font-body);text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-primary{background:var(--panel);color:var(--on-panel)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;vertical-align:middle}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.8fr);gap:48px;align-items:center}
.hero-text{display:flex;flex-direction:column;gap:20px}
.hero h1{font-size:clamp(2.8rem,7.4vw,5.2rem);font-weight:600;letter-spacing:-0.035em;line-height:.98}
.hero .title{font-family:var(--font-display);font-size:clamp(1.15rem,2.2vw,1.5rem);font-weight:500;color:var(--ink);line-height:1.3}
.portrait{aspect-ratio:4/5;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;max-width:360px;width:100%;justify-self:end}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait-mark{height:46%;width:auto}
.portrait .ph{font-size:.82rem;color:var(--muted)}

/* Signature: stitched vessel line */
.vessel{display:flex;flex-direction:column;gap:6px;align-items:center;margin:-16px 0}
.vessel svg{width:100%;height:140px;display:block;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.vessel .lumen{fill:var(--accent-soft)}
.vessel .wall{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.vessel .join{stroke:var(--ink);stroke-width:1.2;fill:none;stroke-dasharray:2 3;opacity:.6}
.vessel .st line{stroke:var(--accent-bright);stroke-width:2;stroke-linecap:round}
.vessel .st circle{fill:var(--accent-bright)}
.vessel.enter .st{animation:stitch .45s var(--ease-enter) both}
.vessel .scale{stroke:var(--muted);stroke-width:1;fill:none;opacity:.7}
.vessel text{fill:var(--muted);font:500 11px var(--font-body);letter-spacing:.04em}
.vessel figcaption{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
@keyframes stitch{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}


/* Facts */
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.fact{padding:22px 24px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line)}
.fact:first-child{border-left:0}
.fact .k{font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact .v{font-family:var(--font-display);font-weight:600;font-size:1.08rem;line-height:1.25}
.fact .s{font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Clinical cards */
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.area{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit}
.area h3{font-size:1.25rem;font-weight:600}
.area p{color:var(--muted);font-size:.98rem}
.area .n{font:600 .8rem var(--font-body);color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.08em}

/* Feature panel */
.panel{background:var(--panel);color:var(--on-panel);border-radius:var(--radius);padding:44px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:end}
.panel .eyebrow{color:var(--accent-bright)}
.panel h2{font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:500;line-height:1.2;margin-top:12px}
.panel .meta{color:var(--on-panel-muted);margin-top:14px;font-size:.98rem}
.panel a{color:var(--on-panel)}
.counts{display:flex;gap:36px;flex-wrap:wrap}
.count b{display:block;font-family:var(--font-display);font-size:3rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.count span{color:var(--on-panel-muted);font-size:.92rem}
.panel-side{display:flex;flex-direction:column;gap:24px;align-items:flex-start}
.panel .btn-light{background:var(--on-panel);color:#0e2b4a}

/* Contact strip */
.strip{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.strip h2{font-size:1.5rem;font-weight:600}
.strip p{color:var(--muted)}

/* About */
.about-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr);gap:48px;align-items:center}
.about-logo{padding:40px 32px;display:flex;justify-content:center}
.about-logo svg{width:100%;max-width:290px;height:auto}
.bio{display:flex;flex-direction:column;gap:16px;max-width:65ch;font-size:1.08rem}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:18px 0;border-bottom:1px solid var(--line)}
.row .when{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem;padding-top:2px}
.row .what b{display:block;font-family:var(--font-display);font-weight:600;font-size:1.08rem;line-height:1.3}
.row .what span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card h2{font-size:1.2rem;font-weight:600;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:12px}
.list li{display:flex;flex-direction:column;gap:1px}
.list b{font-weight:600}
.list span{color:var(--muted);font-size:.95rem}

/* Clinical page */
.focus{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;padding:36px;align-items:start}
.focus-main{display:flex;flex-direction:column;gap:14px}
.focus h2{font-size:1.7rem;font-weight:600}
.focus p{color:var(--muted);max-width:60ch}
.focus h3{font:600 .76rem var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.ticks{display:flex;flex-direction:column;gap:8px}
.ticks li{padding-left:22px;position:relative}
.ticks li::before{content:"";position:absolute;left:0;top:.72em;width:12px;height:2px;background:var(--accent-bright);border-radius:2px}
.focus-side{display:flex;flex-direction:column;gap:26px}
.refs{display:flex;flex-direction:column;gap:8px;font-size:.95rem;color:var(--muted)}
.note{font-size:.95rem;color:var(--muted);max-width:70ch}

/* Research */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .92rem var(--font-body);padding:8px 14px;border-radius:999px;cursor:pointer}
.chip b{color:var(--accent);font-variant-numeric:tabular-nums;margin-left:4px}
.sub{font:600 .78rem var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.cites{counter-reset:c var(--start,0);border-top:1px solid var(--line)}
.cites li{counter-increment:c;display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.cites li::before{content:counter(c,decimal-leading-zero);color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;font-size:.9rem;padding-top:3px}
.cite .t{font-weight:600;line-height:1.4}
.cite .a,.cite .j{color:var(--muted);font-size:.95rem}
.cite .a b{color:var(--ink);font-weight:600}
.cite{display:flex;flex-direction:column;gap:3px}
.links{display:flex;gap:10px;flex-wrap:wrap}

/* Contact */
.contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.contact-grid .card{display:flex;flex-direction:column;gap:10px}
.contact-grid h2{font-size:1.2rem;font-weight:600;margin:0}
.contact-grid p{color:var(--muted)}
.contact-grid p.big{color:var(--ink)}
.big{font-family:var(--font-display);font-size:1.25rem;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.copy{align-self:flex-start;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 .85rem var(--font-body);padding:7px 14px;border-radius:999px;cursor:pointer}
.profiles{display:flex;flex-direction:column;gap:10px}
.profiles a{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);text-decoration:none;color:var(--ink);font-weight:500}
.profiles a span{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}

/* Footer */
.site-foot{border-top:1px solid var(--line);padding:36px 0 44px;color:var(--muted);font-size:.88rem}
.foot-row{display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}
.foot-logo{display:block;width:300px;max-width:100%}
.foot-logo svg{width:100%;height:auto}
.foot-text{display:flex;flex-direction:column;gap:6px;text-align:right;max-width:52ch}

/* Motion: the hero enters once on load, every link and button answers the pointer, nothing moves on scroll */
.skip-link{position:absolute;left:24px;top:-80px;z-index:30;background:var(--panel);color:var(--on-panel);border:0;border-radius:999px;padding:10px 18px;font:600 .9rem var(--font-body);cursor:pointer}
.skip-link:not(:focus-visible){opacity:0;pointer-events:none}
.skip-link:focus-visible{top:12px}
main:focus{outline:none}
.btn,.chip,.copy{transition:transform var(--m-out) var(--ease),background-color var(--m-out) var(--ease),border-color var(--m-out) var(--ease)}
a.card,.profiles a{transition:transform var(--m-out) var(--ease),border-color var(--m-out) var(--ease),box-shadow var(--m-out) var(--ease)}
.m-arrow{display:inline-block;transition:transform var(--m-out) var(--ease)}
main a:not([class]){text-decoration:none;background:linear-gradient(currentColor,currentColor) 100% 100%/0 1px no-repeat;box-shadow:inset 0 -1px 0 color-mix(in srgb,currentColor 32%,transparent);transition:background-size var(--m-out) var(--ease)}
.profiles a:not([class]),.big a:not([class]){background:none;box-shadow:none}
@media (hover: hover) and (pointer: fine){
  .btn:hover,.chip:hover,.copy:hover{transform:translateY(-1px);transition-duration:var(--m-in)}
  .btn-primary:hover{background:color-mix(in srgb,var(--panel) 86%,var(--on-panel))}
  .btn-light:hover{background:color-mix(in srgb,var(--on-panel) 86%,var(--panel))}
  .btn-ghost:hover,.chip:hover,.copy:hover{border-color:color-mix(in srgb,var(--ink) 45%,var(--line));background:color-mix(in srgb,var(--ink) 5%,var(--surface))}
  a.card:hover,.profiles a:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--ink) 30%,var(--line));box-shadow:0 14px 24px -14px color-mix(in srgb,var(--ink) 22%,transparent);transition-duration:180ms}
  .nav a:hover{color:var(--ink)}
  .nav a:hover::after{transform:scaleX(1);transform-origin:left;transition-duration:var(--m-in)}
  .more:hover .m-arrow{transform:translateX(3px);transition-duration:var(--m-in)}
  main a:not([class]):hover{background-size:100% 1px;background-position:0 100%;transition-duration:var(--m-in)}
  .profiles a:not([class]):hover,.big a:not([class]):hover{background-size:0 1px}
}
.btn:active,.chip:active,.copy:active{transform:translateY(1px) scale(.985);transition-duration:var(--m-press)}
.hero h1 .mask{display:block;overflow:hidden;padding:.14em 0;margin:-.14em 0}
.hero h1 .mask > span{display:block}
.hero.enter h1 .mask > span{animation:rise .7s var(--ease-enter) both}
.hero.enter .eyebrow{animation:fadeup .52s var(--ease-enter) both}
.hero.enter .title{animation:fadeup .52s var(--ease-enter) .35s both}
.hero.enter .lead{animation:fadeup .52s var(--ease-enter) .41s both}
.hero.enter .btns{animation:fadeup .52s var(--ease-enter) .47s both}
.hero.enter .portrait{animation:settle .9s var(--ease-enter) both}
@keyframes rise{from{transform:translateY(110%)}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}}
@keyframes settle{from{transform:scale(.98)}}
@media (pointer: coarse){.lang button,.chip,.copy{min-height:44px}}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .hero.enter *,.vessel.enter .st{animation:none !important}
  .btn,.chip,.copy,a.card,.profiles a,.m-arrow,.nav a::after,main a:not([class]){transition:none}
}

@media (max-width: 900px){
  .hero{grid-template-columns:1fr;gap:32px}
  .portrait{justify-self:start;max-width:240px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fact:nth-child(3){border-left:0}
  .fact:nth-child(n+3){border-top:1px solid var(--line)}
  .areas{grid-template-columns:1fr}
  .panel{grid-template-columns:1fr;padding:32px}
  .focus{grid-template-columns:1fr;padding:26px}
  .grid2,.contact-grid{grid-template-columns:1fr}
  .about-top{grid-template-columns:1fr;gap:32px}
  .about-logo{justify-self:start;width:100%;max-width:340px}
  .foot-text{text-align:left}
}
@media (max-width: 560px){
  .wrap{padding:0 18px}
  .page{padding:36px 0 56px;gap:48px}
  .head-row{gap:10px}
  .brand-mark{height:38px}
  .brand-text span{display:none}
  .nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .nav{gap:4px 22px}
  .nav a{white-space:nowrap}
  .facts{grid-template-columns:1fr}
  .fact{border-left:0;border-top:1px solid var(--line)}
  .fact:first-child{border-top:0}
  .row{grid-template-columns:1fr;gap:4px}
  .cites li{grid-template-columns:32px minmax(0,1fr)}
}
</style>

const routeNow = () => { const h = location.hash.replace("#", ""); return PAGES[h] ? h : "home"; };

function render(scrollTop) {
  const r = routeNow();
  ENTER = (firstPaint && r === "home") ? " enter" : "";
  firstPaint = false;
  document.documentElement.lang = lang;
  document.getElementById("skip").textContent = t({ tr: "İçeriğe geç", en: "Skip to content" });
  document.getElementById("nav").innerHTML = NAV.map(([id, label]) =>
    `<a href="#${id}"${id === r ? ' aria-current="page"' : ""}>${t(label)}</a>`).join("");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("main").innerHTML = `<div class="page">${PAGES[r]()}</div>`;
  document.getElementById("foot").innerHTML = `
    <p>© 2026 Çağhan Benli · ${t({ tr: "Son güncelleme", en: "Last updated" })}: ${t(UPDATED)}</p>
    <p>${t({ tr: "Bu sitedeki içerik bilgilendirme amaçlıdır, tanı ve tedavi yerine geçmez.", en: "The content of this site is for information only and does not replace diagnosis or treatment." })}</p>`;
  if (scrollTop) window.scrollTo(0, 0);
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("cb-lang", lang); } catch (e) {}
  render(false);
}));
document.getElementById("main").addEventListener("click", e => {
  const jump = e.target.closest("[data-jump]");
  if (jump) { const el = document.getElementById(jump.dataset.jump); if (el) el.scrollIntoView({ block: "start" }); return; }
  const copy = e.target.closest("#copy-mail");
  if (copy) {
    const done = ok => { copy.textContent = ok ? t({ tr: "Kopyalandı", en: "Copied" }) : EMAIL; };
    try { navigator.clipboard.writeText(EMAIL).then(() => done(true), () => done(false)); } catch (err) { done(false); }
  }
});
document.getElementById("skip").addEventListener("click", () => { const m = document.getElementById("main"); m.setAttribute("tabindex", "-1"); m.focus(); });
window.addEventListener("hashchange", () => render(true));
render(false);
</script>
